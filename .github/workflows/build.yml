name: build

# Gitea 通过 push mirror 把 master 和 tag 同步到 GitHub，由 GitHub 这边编译
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # build.sh 把 JAVA_HOME 写死成 macOS 的 Android Studio JBR 路径，
      # 这里把该路径软链到 runner 上的 JDK，脚本本身不动
      - name: 铺好 Android Studio JBR 路径
        run: |
          set -e
          JBR="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          sudo mkdir -p "$(dirname "$JBR")"
          sudo ln -sfn "$JAVA_HOME" "$JBR"
          "$JBR/bin/java" -version
          "$JBR/bin/javac" -version

      # build.sh 同样写死 SDK 在 $HOME/workspace/android/sdk
      - name: 铺好 SDK 路径
        run: |
          set -e
          SRC="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          DST="$HOME/workspace/android/sdk"
          echo "runner SDK: $SRC"
          mkdir -p "$(dirname "$DST")"
          ln -sfn "$SRC" "$DST"
          SDKM="$SRC/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SRC" -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;35.0.0"
          ls -l "$DST/build-tools/35.0.0/aapt2" "$DST/build-tools/35.0.0/d8" \
                "$DST/build-tools/35.0.0/zipalign" "$DST/build-tools/35.0.0/apksigner" \
                "$DST/platforms/android-34/android.jar"

      # build.sh 用 $HOME/.android/debug.keystore 签名，口令固定 android
      - name: 准备签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "签名用 secret ANDROID_KEYSTORE_BASE64 里的 keystore"
          else
            rm -f "$KS"
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning title=临时签名::没配 secret ANDROID_KEYSTORE_BASE64，本次 APK 用临时 debug key 签名，覆盖安装旧版本会签名冲突"
          fi
          keytool -list -keystore "$KS" -storepass android

      - name: 编译
        run: |
          set -e
          chmod +x build.sh
          ./build.sh

      - name: 校验 APK
        run: |
          set -e
          BT="$HOME/workspace/android/sdk/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs ovdash.apk
          "$BT/aapt2" dump badging ovdash.apk | head -3
          ls -l ovdash.apk
          sha256sum ovdash.apk

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ovdash-apk
          path: ovdash.apk
          if-no-files-found: error

  release:
    name: 发 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 取 APK
        uses: actions/download-artifact@v4
        with:
          name: ovdash-apk

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          NOTES="MG4 车机数据 HUD 浮层（德赛西威 8155 / Android 11 AAOS），主副双屏独立渲染。

          改页面不用重编 APK：把 ui-main.html / ui-cluster.html 放进 /sdcard/Android/media/ov.dash/。

          安装步骤（含 appops 授权、无障碍、通知监听）见 README。

          注意：重装 APK 会清空 appops 授权和无障碍服务，需要重新授权。"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖附件"
            gh release upload "$TAG" ovdash.apk --clobber
          else
            gh release create "$TAG" ovdash.apk \
              --title "ov.dash $TAG" \
              --notes "$NOTES" \
              --verify-tag
          fi
          gh release view "$TAG"
