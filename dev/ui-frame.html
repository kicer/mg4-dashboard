<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ov.dash frame</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent;
            font-family:monospace;color:#fff}
  #f{position:fixed;left:0;top:0;right:0;bottom:0;box-sizing:border-box;
     border:12px solid #ff2d55;pointer-events:none;z-index:10}
  #f::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;box-sizing:border-box;
            border:3px solid #fff}
  .cn{position:fixed;width:46px;height:46px;background:#ffd60a;z-index:11}
  .c1{left:0;top:0}.c2{right:0;top:0}.c3{left:0;bottom:0}.c4{right:0;bottom:0}
  #box{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
       background:rgba(0,0,0,.75);padding:14px 20px;border-radius:12px;
       font-size:19px;line-height:1.55;white-space:nowrap;z-index:12}
  #box b{color:#ffd60a;font-size:25px}
  .k{color:#9a9aa0}
  .bar{position:fixed;left:0;right:0;height:75px;box-sizing:border-box;
       background:rgba(255,159,10,.20);border-top:2px dashed #ff9f0a;
       border-bottom:2px dashed #ff9f0a;pointer-events:none;display:none;z-index:9}
  .bt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      font-size:15px;color:#ff9f0a;letter-spacing:1px}
</style>
</head>
<body>
<div id="f"></div>
<i class="cn c1"></i><i class="cn c2"></i><i class="cn c3"></i><i class="cn c4"></i>
<div class="bar" id="b1"><span class="bt">QNX 边栏 75px，勿用</span></div>
<div class="bar" id="b2"><span class="bt">QNX 边栏 75px，勿用</span></div>
<div id="box">等待数据…</div>
<script>
(function(){
  var box = document.getElementById('box');
  var n = 0, last = '';
  function px(v){ return Math.round(v * (window.devicePixelRatio || 1)); }
  function paint(){
    var pw = px(window.innerWidth), ph = px(window.innerHeight);
    var tag = pw >= 1600 ? '主屏 display 0' : '副屏 display 1';
    var hint = pw >= 1600 ? '1920 × 990' : '1280 × 618（上下各让 75 物理）';
    box.innerHTML =
      '<b>' + tag + '</b><br>' +
      '<span class="k">物理</span> ' + pw + ' × ' + ph +
      ' &nbsp; <span class="k">CSS</span> ' + window.innerWidth + ' × ' + window.innerHeight +
      '<br><span class="k">可用</span> ' + hint +
      '<br><span class="k">数据</span> ' + n + ' 帧 &nbsp; ' + last;
  }
  function bars(){
    var on = (px(window.innerWidth) < 1600);
    var b1 = document.getElementById('b1'), b2 = document.getElementById('b2');
    b1.style.display = b2.style.display = on ? 'block' : 'none';
    if (on) {
      // 75 是物理像素，换算成 CSS 才是标注带的真实高度
      var h = (75 / (window.devicePixelRatio || 1)) + 'px';
      b1.style.height = b2.style.height = h;
      b1.style.top = '0px'; b2.style.bottom = '0px';
    }
  }
  window.onData = function(d){
    n++;
    last = 'soc ' + (d.soc == null ? '-' : d.soc.toFixed(1)) +
           '  speed ' + (d.speed == null ? '-' : d.speed) +
           '  HUD_SW ' + (d.HUD_SW_STS == null ? '-' : d.HUD_SW_STS) +
           '  SEAT ' + (d.SEAT_RECLINE_ANGLE == null ? '-' : d.SEAT_RECLINE_ANGLE) +
           '  field ' + Object.keys(d).length + '  tick=' + (d._tick == null ? '-' : d._tick);
    paint();
  };
  window.addEventListener('resize', function(){ bars(); paint(); });
  bars(); paint();
})();
</script>
</body>
</html>
