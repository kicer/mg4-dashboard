<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:-apple-system,'Noto Sans CJK SC',sans-serif;-webkit-user-select:none}
  #c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

var W = 1280, H = 660;
var cvs = document.getElementById('c');
cvs.width = W; cvs.height = H;
var ctx = cvs.getContext('2d');

/* ---- 卡片布局 ---- */
var PAD = 25;
var TOP_Y = 46;          /* 顶部让出状态栏 */
var BOT_Y = 513;         /* 底部留白：比原位置向上 15px */
var GAP = 14;
var INFO_H = 46;

var COL1_X = PAD, COL1_W = 755;
var COL2_X = PAD + COL1_W + GAP, COL2_W = W - PAD - (PAD + COL1_W + GAP);
var PLOT_TOP = TOP_Y;
var PLOT_BOT = BOT_Y - INFO_H - GAP;
var CARD_H = (PLOT_BOT - PLOT_TOP - GAP) / 2;

/* ---- 数据 ---- */
var MAX_SAMPLES = 20000;
var samples = [];
var lastSpeed = 0, lastTs = null;
var speed = 0, targetSpeed = 0;
var soc = 78, range = 0, accel = 0, trip = 0;
var current = 0, voltage = 0, alt = 0;
var tp = [0, 0, 0, 0];        /* FL FR RL RR 胎压 */
var trip1 = 0;                /* 小记里程 1 */
var drivingSec = 0;           /* 行车时长（秒） */
var inTemp = 0, outTemp = 0;  /* 车内 IACINCARTEM / 车外 OUTSIDE_TEP */

var SERIES = [
  { key: 'speed',   name: '车速', min: 0,   max: 180, unit: 'km/h', c: '0,229,255', dec: 0 },
  { key: 'current', name: '电流', min: -50, max: 200, unit: 'A',    c: '0,255,168', dec: 1 }
];

/* canvas 2d 在 Chrome 83 没有 roundRect，手画 */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function card(x, y, w, h) {
  roundRect(x, y, w, h, 16);
  ctx.fillStyle = 'rgba(6,13,22,.82)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,229,255,.15)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawSeries(s, x, y, w, h) {
  card(x, y, w, h);

  var inX = x + 20, inW = w - 40;
  var topPad = 46, botPad = 14;
  var mid = y + topPad + (h - topPad - botPad) / 2;
  var half = (h - topPad - botPad) * 0.38;

  /* 标题 + 当前值 */
  ctx.textAlign = 'left';
  ctx.font = '500 16px -apple-system, "Noto Sans CJK SC", sans-serif';
  ctx.fillStyle = 'rgba(' + s.c + ',.7)';
  ctx.fillText(s.name, x + 20, y + 28);

  var cv = s.key === 'speed' ? speed : current;
  ctx.textAlign = 'right';
  ctx.font = '700 28px -apple-system, "Noto Sans CJK SC", sans-serif';
  ctx.fillStyle = 'rgba(' + s.c + ',.95)';
  ctx.fillText(cv.toFixed(s.dec) + ' ' + s.unit, x + w - 20, y + 30);

  /* 电流卡片右下角显示电压 */
  if (s.key === 'current') {
    ctx.font = '500 14px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(' + s.c + ',.55)';
    ctx.fillText(voltage ? '电压 ' + voltage.toFixed(1) + 'V' : '--', x + w - 20, y + h - 14);
  }

  /* 中线 */
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(inX, mid); ctx.lineTo(inX + inW, mid); ctx.stroke();

  if (samples.length < 2) return;

  var step = Math.max(1, Math.floor(samples.length / 320));
  var n = samples.length, span = Math.max(1, n - 1);

  ctx.beginPath();
  var started = false;
  for (var i = 0; i < n; i += step) {
    var sm = samples[i];
    var v = sm[s.key];
    if (v == null || !isFinite(v)) { started = false; continue; }
    var px = inX + (i / span) * inW;
    var t = (v - s.min) / (s.max - s.min);
    t = Math.max(-0.12, Math.min(1.12, t));
    var py = mid + half - t * half * 2;
    if (!started) { ctx.moveTo(px, py); started = true; }
    else ctx.lineTo(px, py);
  }
  /* 两遍描边假辉光：粗低透明打底 + 细实色。
     原 shadowBlur=8 要对整条折线的包围盒做高斯模糊，是主屏最贵的一项 */
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(' + s.c + ',.16)';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(' + s.c + ',.92)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawCompass(x, y, w, h) {
  card(x, y, w, h);

  var cx = x + w / 2;
  var cy = y + h / 2 - 8;
  var r = Math.min(w, h) / 2 - 52;

  ctx.textAlign = 'center';
  ctx.font = '500 16px -apple-system, "Noto Sans CJK SC", sans-serif';
  ctx.fillStyle = 'rgba(0,229,255,.72)';
  ctx.fillText('方向', cx, y + 30);

  ctx.strokeStyle = 'rgba(0,229,255,.32)';
  ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2); ctx.stroke();

  ctx.strokeStyle = 'rgba(0,229,255,.18)';
  ctx.beginPath();
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
  ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
  ctx.stroke();

  ctx.font = '500 11px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(120,190,215,.45)';
  ctx.fillText('N', cx, cy - r + 15);
  ctx.fillText('S', cx, cy + r - 3);
  ctx.fillText('W', cx - r + 9, cy + 4);
  ctx.fillText('E', cx + r - 9, cy + 4);

  var step = Math.max(1, Math.floor(samples.length / 300));
  ctx.beginPath();
  var started = false;
  for (var i = 0; i < samples.length; i += step) {
    var sm = samples[i];
    if (sm.bearing == null || !isFinite(sm.bearing)) { started = false; continue; }
    var a = sm.bearing * Math.PI / 180;
    var rr = r * (0.22 + 0.72 * Math.min(1, sm.speed / 110));
    var px = cx + Math.sin(a) * rr;
    var py = cy - Math.cos(a) * rr;
    /* 每段从圆心起笔，看起来是「从中心射出去」的轨迹 */
    if (!started) { ctx.moveTo(cx, cy); ctx.lineTo(px, py); started = true; }
    else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = 'rgba(255,167,38,.85)';
  ctx.lineWidth = 2.2;
  ctx.stroke();

  var last = null;
  for (var i = samples.length - 1; i >= 0; i--) {
    if (samples[i].bearing != null && isFinite(samples[i].bearing)) { last = samples[i]; break; }
  }
  if (last) {
    var la = last.bearing * Math.PI / 180;
    var lx = cx + Math.sin(la) * r * 0.92;
    var ly = cy - Math.cos(la) * r * 0.92;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(lx, ly);
    ctx.strokeStyle = 'rgba(0,229,255,.2)';
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,229,255,.9)';
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.font = '500 13px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(0,229,255,.7)';
    ctx.fillText(Math.round(last.bearing) + '°', cx, cy + r + 26);
  } else {
    ctx.font = '400 12px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(120,190,215,.3)';
    ctx.fillText('无方向数据', cx, cy + r + 24);
  }

  /* 海拔：放卡片右下角 */
  ctx.textAlign = 'right';
  ctx.font = '500 13px -apple-system, "Noto Sans CJK SC", sans-serif';
  ctx.fillStyle = 'rgba(120,190,215,.58)';
  ctx.fillText('海拔 ' + (alt ? Math.round(alt) + ' m' : '--'), x + w - 20, y + h - 16);
}

function drawInfo() {
  var y = BOT_Y - INFO_H;
  card(PAD, y, W - PAD * 2, INFO_H);

  var mins = Math.floor(drivingSec / 60);
  var dur;
  if (mins < 1) dur = '不到 1 分钟';
  else if (mins < 60) dur = mins + ' 分钟';
  else dur = Math.floor(mins / 60) + ' 小时 ' + (mins % 60) + ' 分钟';

  ctx.font = '500 14px -apple-system, "Noto Sans CJK SC", sans-serif';

  /* 左：行车时长 + 累计里程 */
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(120,180,205,.62)';
  ctx.fillText('本次行车 ' + dur + '，累计 ' + trip.toFixed(1) + ' km', PAD + 20, y + 29);

  /* 中：车内 / 室外温度 */
  ctx.textAlign = 'center';
  ctx.fillText('车内 ' + (inTemp ? inTemp.toFixed(1) + '°' : '--') +
               '　室外 ' + (outTemp ? outTemp.toFixed(1) + '°' : '--'), W / 2, y + 29);

  /* 右：四轮胎压，异常整体变红 */
  var parts = [];
  var bad = false;
  for (var i = 0; i < 4; i++) {
    parts.push(tp[i] ? tp[i].toFixed(2) : '--');
    if (tp[i] > 0 && (tp[i] < 1.8 || tp[i] > 3.2)) bad = true;
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = bad ? 'rgba(255,90,90,.9)' : 'rgba(120,180,205,.62)';
  ctx.fillText('胎压 ' + parts.join('/'), W - PAD - 20, y + 29);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  drawSeries(SERIES[0], COL1_X, PLOT_TOP, COL1_W, CARD_H);
  drawSeries(SERIES[1], COL1_X, PLOT_TOP + CARD_H + GAP, COL1_W, CARD_H);
  drawCompass(COL2_X, PLOT_TOP, COL2_W, PLOT_BOT - PLOT_TOP);
  drawInfo();
}

var last = 0;
function loop(ts) {
  if (!last) last = ts;
  /* 限到 ~30fps：只在真正要画时推进 last，否则 60Hz 下会被永久跳过 */
  if (ts - last < 30) { requestAnimationFrame(loop); return; }
  var dt = Math.min(0.05, (ts - last) / 1000) || 0.016;
  last = ts;
  speed += (targetSpeed - speed) * Math.min(1, dt * 2.6);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.onData = function (d) {
  targetSpeed = d.SPEED == null ? 0 : d.SPEED;
  if (d.BMS_SOC_PERCENT != null) soc = d.BMS_SOC_PERCENT;
  if (d.RANGE != null) range = d.RANGE;

  if (d.BMS_DISP_PACK_CURRENT_ORG != null) current = d.BMS_DISP_PACK_CURRENT_ORG;
  if (d.BMS_DISP_PACK_VOL_ORG != null) voltage = d.BMS_DISP_PACK_VOL_ORG;
  if (d.alt != null) alt = d.alt;
  if (d.IPK_TRIPMETER_TRIP1 != null) trip1 = d.IPK_TRIPMETER_TRIP1;
  if (d.IACINCARTEM != null) inTemp = d.IACINCARTEM;
  if (d.OUTSIDE_TEP != null) outTemp = d.OUTSIDE_TEP;
  if (d.FL_TIRE_PRESSURE != null) tp[0] = d.FL_TIRE_PRESSURE;
  if (d.FR_TIRE_PRESSURE != null) tp[1] = d.FR_TIRE_PRESSURE;
  if (d.RL_TIRE_PRESSURE != null) tp[2] = d.RL_TIRE_PRESSURE;
  if (d.RR_TIRE_PRESSURE != null) tp[3] = d.RR_TIRE_PRESSURE;

  var spd = d.SPEED == null ? 0 : d.SPEED;
  accel = (spd - lastSpeed) / 3.6;
  lastSpeed = spd;

  var now = d._ts || Date.now();
  var dtSec = lastTs == null ? 1 : Math.min(5, (now - lastTs) / 1000);
  lastTs = now;

  if (spd > 1) {
    trip += spd / 3600 * dtSec;
    drivingSec += dtSec;
    samples.push({
      speed: spd,
      current: current,
      bearing: (d.bearing == null || !isFinite(d.bearing)) ? null : d.bearing
    });
    if (samples.length > MAX_SAMPLES) samples.splice(0, 2000);
  }
};

})();
</script>
</body>
</html>
