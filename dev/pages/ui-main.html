<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ov.dash main</title>
<style>
/* 主屏 1708×880（CSS），背景必须透明，露出原厂桌面 */
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:'Helvetica Neue',Arial,'Noto Sans CJK SC',sans-serif;
  -webkit-user-select:none;color:#dff6ff}
#fx{position:absolute;left:0;top:0;width:100%;height:100%}
#hud{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

/* ---- 中央读数 ---- */
#spd{position:absolute;left:0;top:50%;width:100%;text-align:center;
  margin-top:-108px;font-size:216px;font-weight:800;line-height:1;
  letter-spacing:-10px;color:#fff;will-change:transform;
  text-shadow:0 0 28px rgba(125,211,252,.9),0 0 96px rgba(56,189,248,.5)}
#unit{position:absolute;left:0;top:50%;width:100%;text-align:center;
  margin-top:122px;font-size:15px;letter-spacing:15px;text-indent:15px;
  color:rgba(186,230,253,.5)}
#aec{position:absolute;left:0;top:50%;width:100%;text-align:center;
  margin-top:158px;font-size:18px;letter-spacing:3px;
  color:rgba(244,114,182,.92);text-shadow:0 0 20px rgba(244,114,182,.55)}

/* ---- 左侧电量柱 ---- */
#bat{position:absolute;left:104px;top:50%;margin-top:-160px;width:74px}
#segs{display:-webkit-flex;display:flex;-webkit-flex-direction:column-reverse;
  flex-direction:column-reverse;height:252px;justify-content:space-between}
.seg{height:11px;border-radius:3px;background:rgba(125,211,252,.10);
  box-shadow:inset 0 0 0 1px rgba(125,211,252,.14);transition:background .35s,box-shadow .35s}
.seg.on{background:rgba(56,189,248,.9);
  box-shadow:0 0 12px rgba(56,189,248,.75),inset 0 0 6px rgba(255,255,255,.45)}
.seg.low{background:rgba(251,113,133,.9);box-shadow:0 0 12px rgba(251,113,133,.75)}
#btxt{margin-top:14px;text-align:center;line-height:1.35}
#soc{font-size:26px;font-weight:700;color:#bae6fd;letter-spacing:0;
  text-shadow:0 0 16px rgba(56,189,248,.6)}
#rng{display:block;font-size:13px;font-style:normal;letter-spacing:1px;
  color:rgba(186,230,253,.55)}

/* ---- 右侧胎压 ---- */
#tires{position:absolute;right:104px;top:50%;margin-top:-118px;width:230px;text-align:right}
.t{display:inline-block;width:104px;margin:0 0 18px 18px;text-align:left;vertical-align:top}
.t i{display:block;font-style:normal;font-size:11px;letter-spacing:2px;
  color:rgba(186,230,253,.42);margin-bottom:2px}
.t b{font-size:25px;font-weight:700;letter-spacing:-1px;
  color:rgba(186,230,253,.9);text-shadow:0 0 14px rgba(56,189,248,.4)}
.t b.warn{color:#fbbf24;text-shadow:0 0 16px rgba(251,191,36,.6)}
.t b.bad{color:#fb7185;text-shadow:0 0 16px rgba(251,113,133,.7)}

/* ---- 告警 ---- */
#warn{position:absolute;left:0;bottom:64px;width:100%;text-align:center;
  font-size:19px;letter-spacing:4px;color:#fb7185;display:none;white-space:pre-line;
  text-shadow:0 0 22px rgba(251,113,133,.8);
  -webkit-animation:blink 1.1s ease-in-out infinite;animation:blink 1.1s ease-in-out infinite}
@-webkit-keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
</style></head>
<body>
<canvas id="fx"></canvas>
<div id="hud">
  <div id="spd">--</div>
  <div id="unit">KM/H</div>
  <div id="aec">-- kWh/100</div>

  <div id="bat">
    <div id="segs"></div>
    <div id="btxt"><b id="soc">--</b><i id="rng">-- km</i></div>
  </div>

  <div id="tires">
    <div class="t"><i>FL</i><b id="tfl">--</b></div>
    <div class="t"><i>FR</i><b id="tfr">--</b></div>
    <div class="t"><i>RL</i><b id="trl">--</b></div>
    <div class="t"><i>RR</i><b id="trr">--</b></div>
  </div>

  <div id="warn"></div>
</div>
<script>
(function () {
  var TAU = Math.PI * 2;
  var W = 1708, H = 880, S = 0.5;          /* 画布半分辨率，CSS 拉伸，省一半像素 */
  var CX = W / 2, CY = H / 2 - 8;
  var RING = 292;                           /* 刻度环半径 */
  var TICKS = 72;
  var A0 = Math.PI * 0.75, SWEEP = Math.PI * 1.5;   /* 135° 起，顺时针 270° */
  var SQ = 0.55;                            /* 粒子盘纵向压扁，做出俯视透视 */

  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  cv.width = W * S; cv.height = H * S;

  /* ---------- 粒子盘 ---------- */
  var NP = 380, P = [];
  function newP() {
    return {
      a: Math.random() * TAU,
      r: 336 + Math.random() * 424,
      dir: Math.random() < 0.82 ? 1 : -1,
      w: 0.5 + Math.random() * 1.15,
      sz: 0.8 + Math.random() * 2.0,
      ln: 0.03 + Math.random() * 0.09,
      al: 0.16 + Math.random() * 0.44,
      ph: Math.random() * TAU,
      dh: Math.random() * 32 - 16
    };
  }
  for (var i = 0; i < NP; i++) P.push(newP());

  /* ---------- 状态 ---------- */
  var spdCur = 0, spdTgt = 0, lastSpd = 0, f = 0;
  var t0 = 0, lastT = 0, raf = 0;
  var pulses = [];

  var spdEl = document.getElementById('spd');
  var aecEl = document.getElementById('aec');
  var socEl = document.getElementById('soc');
  var rngEl = document.getElementById('rng');
  var warnEl = document.getElementById('warn');
  var segsEl = document.getElementById('segs');

  /* 电量柱：16 格，从下往上亮 */
  var NSEG = 16;
  for (var s = 0; s < NSEG; s++) {
    var d = document.createElement('div');
    d.className = 'seg';
    segsEl.appendChild(d);
  }
  var segNodes = segsEl.children;

  function hue() { return 190 + f * 120; }   /* 青 → 紫 → 品红 */

  /* ---------- 主循环 ---------- */
  function frame(now) {
    if (!lastT) lastT = now;
    var dt = Math.min(64, now - lastT); lastT = now;
    t0 += dt;

    spdCur += (spdTgt - spdCur) * Math.min(1, dt / 240);
    f = Math.max(0, Math.min(1, spdCur / 160));

    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var h = hue();

    /* 中心光晕 */
    var g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 380);
    g.addColorStop(0, 'hsla(' + h + ',100%,60%,' + (0.06 + f * 0.10).toFixed(3) + ')');
    g.addColorStop(1, 'hsla(' + h + ',100%,60%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(CX - 400, CY - 400, 800, 800);

    /* 粒子：绕中心旋转，车速决定角速度、尾长、亮度 */
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    var spin = 0.16 + f * 1.25;
    for (var i = 0; i < NP; i++) {
      var p = P[i];
      p.a += p.dir * spin * p.w * dt / 1000 * (300 / (p.r + 120));
      var rr = p.r + Math.sin(t0 * 0.0007 + p.ph) * 14;
      var x1 = CX + Math.cos(p.a) * rr;
      var y1 = CY + Math.sin(p.a) * rr * SQ;
      var a2 = p.a - p.dir * (p.ln * (0.6 + f * 1.9));
      var x2 = CX + Math.cos(a2) * rr;
      var y2 = CY + Math.sin(a2) * rr * SQ;
      var al = p.al * (0.5 + f * 0.85);
      ctx.strokeStyle = 'hsla(' + (h + p.dh) + ',100%,' + (62 + f * 16) + '%,' + al.toFixed(3) + ')';
      ctx.lineWidth = p.sz;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    /* 刻度环 */
    var lit = f * (TICKS - 1);
    for (var k = 0; k < TICKS; k++) {
      var ang = A0 + SWEEP * k / (TICKS - 1);
      var on = k <= lit;
      var big = (k % 6 === 0);
      var r1 = RING + 6, r2 = RING + (big ? 32 : 17);
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(ang) * r1, CY + Math.sin(ang) * r1);
      ctx.lineTo(CX + Math.cos(ang) * r2, CY + Math.sin(ang) * r2);
      ctx.lineWidth = big ? 2.6 : 1.3;
      ctx.strokeStyle = on
        ? 'hsla(' + h + ',100%,70%,0.92)'
        : 'hsla(' + h + ',90%,72%,0.14)';
      ctx.stroke();
    }

    /* 速度弧 */
    if (f > 0.002) {
      var e = A0 + SWEEP * f;
      ctx.beginPath(); ctx.arc(CX, CY, RING - 4, A0, e, false);
      ctx.lineWidth = 18; ctx.strokeStyle = 'hsla(' + h + ',100%,60%,0.10)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(CX, CY, RING - 4, A0, e, false);
      ctx.lineWidth = 5; ctx.strokeStyle = 'hsla(' + h + ',100%,68%,0.92)'; ctx.stroke();
    }

    /* 速度跳变时的扩散脉冲 */
    for (var j = pulses.length - 1; j >= 0; j--) {
      var u = pulses[j];
      u.t += dt / 1000;
      var kk = u.t / 0.9;
      if (kk >= 1) { pulses.splice(j, 1); continue; }
      ctx.beginPath();
      ctx.arc(CX, CY, RING - 4 + kk * 130, 0, TAU);
      ctx.lineWidth = 2.2 * (1 - kk) + 0.4;
      ctx.strokeStyle = 'hsla(' + h + ',100%,74%,' + ((1 - kk) * 0.45).toFixed(3) + ')';
      ctx.stroke();
    }

    spdEl.style.transform = 'scale(' + (1 + f * 0.05).toFixed(3) + ')';
    spdEl.style.textShadow = '0 0 28px hsla(' + h + ',100%,70%,.9),0 0 96px hsla(' + h + ',100%,60%,.5)';
    aecEl.style.color = 'hsla(' + h + ',100%,76%,.95)';

    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  /* ---------- 数据入口 ---------- */
  function n(v, d) { return (v == null || isNaN(v)) ? '--' : Number(v).toFixed(d == null ? 1 : d); }

  /* 瞬时电耗：电压 × 电流 / 车速，速度太低时退回平均电耗 */
  function instantAec(d) {
    var volt = d.BMS_DISP_PACK_VOL_ORG, curr = d.BMS_DISP_PACK_CURRENT_ORG, spd = d.SPEED;
    if (volt > 0 && curr != null && spd != null && spd > 3) {
      return Math.max(0, volt * curr / 1000 / spd * 100);
    }
    return d.IPK_AVERAGE_PC_AEC1;
  }

  function tireClass(v) {
    if (v == null || isNaN(v)) return '';
    if (v < 1.8 || v > 3.0) return 'bad';
    if (v < 2.0 || v > 2.8) return 'warn';
    return '';
  }

  window.onData = function (d) {
    var v = (d.SPEED == null || isNaN(d.SPEED)) ? 0 : Number(d.SPEED);
    spdTgt = v;
    spdEl.textContent = (d.SPEED == null) ? '--' : Math.round(v);
    if (Math.abs(v - lastSpd) > 3) pulses.push({ t: 0 });
    lastSpd = v;

    var a = instantAec(d);
    aecEl.textContent = (a == null || isNaN(a) ? '--' : a.toFixed(1)) + ' kWh/100';

    var soc = d.BMS_SOC_PERCENT;
    socEl.textContent = (soc == null) ? '--' : Math.round(soc) + '%';
    rngEl.textContent = (d.RANGE == null ? '--' : Math.round(d.RANGE)) + ' km';

    var lit = (soc == null) ? 0 : Math.round(Math.max(0, Math.min(100, soc)) / 100 * NSEG);
    var low = (soc != null && soc < 20);
    for (var i = 0; i < NSEG; i++) {
      segNodes[i].className = 'seg' + (i < lit ? (low ? ' on low' : ' on') : '');
    }

    var ts = [['tfl', d.FL_TIRE_PRESSURE], ['tfr', d.FR_TIRE_PRESSURE],
              ['trl', d.RL_TIRE_PRESSURE], ['trr', d.RR_TIRE_PRESSURE]];
    var bad = [];
    for (var j = 0; j < ts.length; j++) {
      var el = document.getElementById(ts[j][0]);
      var pv = ts[j][1];
      el.textContent = n(pv, 1);
      el.className = tireClass(pv);
      if (pv != null && (pv < 2.0 || pv > 2.9)) bad.push(ts[j][0].toUpperCase().slice(1) + ' 胎压 ' + pv.toFixed(1));
    }

    if (d.DOOR_OPEN_COND && d.DOOR_OPEN_COND != 0) bad.push('车门未关');
    if (soc != null && soc < 10) bad.push('电量过低');

    if (bad.length) { warnEl.style.display = 'block'; warnEl.textContent = bad.join('   ·   '); }
    else { warnEl.style.display = 'none'; }
  };
})();
</script>
</body></html>
