<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ov.dash cluster</title>
<style>
/* 副屏 1139×684（CSS）。上下各 67px 是 QNX 边栏，右侧有 QNX 信息栏，
   所以内容全部压在 y:70~615、x:60~900 这块安全区里 */
:root{--g:#22d3ee;--g2:#34d399;--dim:rgba(34,211,238,.42)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:'Helvetica Neue',Arial,'Noto Sans CJK SC',sans-serif;
  -webkit-user-select:none;color:#e6fbff}
#fx{position:absolute;left:0;top:0;width:100%;height:100%}
#hud{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

/* ---- 中央圆表 ---- */
#gauge{position:absolute;left:104px;top:134px;width:392px;height:392px}
/* 字号档位：9 微标签 / 12 标签 / 15 次级数值 / 17 数值 / 21 大数值 / 108 主数值 */
#spd{position:absolute;left:0;top:50%;width:100%;text-align:center;margin-top:-54px;
  font-size:108px;font-weight:800;line-height:1;letter-spacing:-4px;color:#e6fbff;
  text-shadow:0 0 22px rgba(230,251,255,.6),0 0 70px rgba(230,251,255,.25)}
#unit{position:absolute;left:0;top:50%;width:100%;text-align:center;margin-top:58px;
  font-size:18px;letter-spacing:5px;text-indent:5px;color:rgba(230,251,255,.5)}
#aec{position:absolute;left:0;top:50%;width:100%;text-align:center;margin-top:88px;
  line-height:1;font-size:0}
#aec b{font-size:24px;font-weight:600;letter-spacing:0;color:#e6fbff}
#aec i{font-style:normal;font-size:18px;letter-spacing:5px;
  color:rgba(230,251,255,.5);margin-left:8px}
#cap{position:absolute;left:0;top:50%;width:100%;text-align:center;margin-top:-94px;
  font-size:18px;letter-spacing:5px;text-indent:5px;color:rgba(230,251,255,.5)}

/* ---- 胎压俯视图 ---- */
#tire{position:absolute;left:664px;top:215px;width:220px;height:230px}
#tire .cap{font-size:12px;letter-spacing:1px;color:rgba(230,251,255,.3)}
#tire .body{position:absolute;left:62px;top:52px;width:96px;height:126px;
  border:1px solid rgba(34,211,238,.18);border-radius:6px;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
  -webkit-justify-content:center;justify-content:center}
#tire .wheel{position:absolute;width:60px;height:62px;border-radius:8px;
  background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.28);
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  -webkit-align-items:center;align-items:center;
  -webkit-justify-content:space-between;justify-content:space-between;
  padding:11px 0 6px;transition:border-color .3s,background .3s}
#tire .wheel.fl{left:0;top:0}
#tire .wheel.fr{right:0;top:0}
#tire .wheel.rl{left:0;bottom:0}
#tire .wheel.rr{right:0;bottom:0}
#tire .wheel b{font-size:24px;font-weight:600;line-height:1;letter-spacing:-.5px;
  color:#e6fbff}
#tire .wheel span{font-size:14px;line-height:1;letter-spacing:1.2px;
  color:rgba(230,251,255,.45)}
#tire .wheel.bad{border-color:rgba(251,113,133,.75);background:rgba(251,113,133,.10)}
#tire .wheel.warn{border-color:rgba(251,191,36,.7);background:rgba(251,191,36,.08)}

/* ---- 电流竖条：零线在 25% 处，向上=放电，向下=回收 ---- */
#amp{position:absolute;left:1032px;top:210px;width:72px;text-align:center}
#amp .track{position:relative;width:12px;height:250px;margin:0 auto;
  background:rgba(34,211,238,.10);border-radius:5px;overflow:hidden}
#amp .track i{position:absolute;left:0;bottom:25%;width:100%;height:0;
  border-radius:3px;box-shadow:0 0 10px rgba(34,211,238,.7);
  transition:height .35s ease,bottom .35s ease}
/* 零线：上方 0~200A 放电，下方 0~60A 回收 */
#amp .track .zero{position:absolute;left:0;bottom:25%;width:100%;height:1px;
  background:rgba(230,251,255,.45)}
#amp .val{margin-top:10px;font-size:24px;font-weight:600;letter-spacing:-.3px;
  color:#e6fbff;white-space:nowrap}
#amp .val small{font-size:16px;font-weight:400;color:rgba(230,251,255,.45);margin-left:2px}

/* ---- 底部：多媒体，居中 ---- */
#foot{position:absolute;left:60px;top:566px;width:1020px;height:46px;
  border-top:1px solid rgba(34,211,238,.16);
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
  -webkit-justify-content:center;justify-content:center}
#foot .mp{font-size:18px;color:rgba(230,251,255,.7);margin-right:14px}
#foot .mt{font-size:22px;font-weight:700;letter-spacing:0;color:#e6fbff;
  max-width:640px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#foot .ma{font-size:17px;color:rgba(230,251,255,.5);margin-left:14px;white-space:nowrap}

/* ---- 海拔 / 室外温度：图标 + 数值，无标签 ---- */
.mini{position:absolute;width:126px;height:46px;border-radius:8px;
  background:rgba(2,6,12,.82);border:1px solid rgba(34,211,238,.16);
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
  -webkit-justify-content:center;justify-content:center}
.mini svg{width:18px;height:18px;margin-right:8px;fill:none;
  stroke:rgba(230,251,255,.55);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.mini b{font-size:24px;font-weight:600;line-height:1;color:#e6fbff}
#m-alt{left:18px;top:70px}
#m-out{right:18px;top:70px}

/* ---- 四角装饰 ---- */
.corner{position:absolute;width:26px;height:26px;border:1px solid rgba(34,211,238,.3)}
#c2{left:52px;top:614px;border-right:0;border-top:0}
#c4{left:1080px;top:614px;border-left:0;border-top:0}
</style></head>
<body>
<canvas id="fx"></canvas>
<div class="corner" id="c2"></div>
<div class="corner" id="c4"></div>

<div id="hud">
  <!-- 左上：海拔；右上：室外温度 -->
  <div class="mini" id="m-alt">
    <svg viewBox="0 0 24 24"><path d="M2.5 19h19L14 7 9.5 15.5 7 11z"/></svg>
    <b id="alt">--</b>
  </div>
  <div class="mini" id="m-out">
    <svg viewBox="0 0 24 24"><path d="M12 4.5a2 2 0 0 1 2 2v7.2a4.4 4.4 0 1 1-4 0V6.5a2 2 0 0 1 2-2z"/><path d="M12 10.5v6"/></svg>
    <b id="intemp">--</b>
  </div>

  <div id="gauge">
    <div id="cap">Trip1</div>
    <div id="spd">--</div>
    <div id="unit">km</div>
    <div id="aec"><b id="aecv">--</b><i>kWh/100km</i></div>
  </div>

  <!-- 胎压：俯视图，四个轮子对应实际位置。单位 kPa，推荐 250 -->
  <div id="tire">
    <div class="body"><span class="cap">kPa</span></div>
    <div class="wheel fl"><b id="tfl">--</b><span>FL</span></div>
    <div class="wheel fr"><b id="tfr">--</b><span>FR</span></div>
    <div class="wheel rl"><b id="trl">--</b><span>RL</span></div>
    <div class="wheel rr"><b id="trr">--</b><span>RR</span></div>
  </div>

  <!-- 电流：零线上下双向，向上放电 / 向下回收 -->
  <div id="amp">
    <div class="track"><i id="ampfill"></i><span class="zero"></span></div>
    <div class="val"><span id="curr">--</span><small>A</small></div>
  </div>

  <div id="foot">
    <span class="mp" id="mplay">♪</span>
    <span class="mt" id="mtitle">--</span>
    <span class="ma" id="martist"></span>
  </div>
</div>

<script>
(function () {
  var TAU = Math.PI * 2;
  var W = 1139, H = 684, S = 0.5;
  var CX = 300, CY = 330, R = 196;
  var A0 = Math.PI * 0.75, SWEEP = Math.PI * 1.5;
  var TICKS = 60;
  /* 电流告警阈值（A）：≤WARN 青色，WARN~HOT 琥珀，>HOT 红 */
  var AMP_WARN = 60, AMP_HOT = 120;

  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  cv.width = W * S; cv.height = H * S;

  /* 刻度端点预计算：60 条永不变化，不必每帧算三角函数 */
  var TICK_GEO = [];
  for (var tk = 0; tk < TICKS; tk++) {
    var ta = A0 + SWEEP * tk / (TICKS - 1);
    var tb = (tk % 5 === 0);
    var tr2 = R + (tb ? 24 : 13);
    TICK_GEO.push([
      CX + Math.cos(ta) * (R + 5), CY + Math.sin(ta) * (R + 5),
      CX + Math.cos(ta) * tr2,     CY + Math.sin(ta) * tr2,
      tb
    ]);
  }

  /* 静态渐变只建一次，不在渲染循环里 new */
  var GLOW_GRAD = ctx.createRadialGradient(CX, CY, 0, CX, CY, 180);
  GLOW_GRAD.addColorStop(0, 'hsla(186,100%,60%,1)');
  GLOW_GRAD.addColorStop(1, 'hsla(186,100%,60%,0)');

  /* ---------- 状态 ---------- */
  var spdCur = 0, spdTgt = 0, f = 0, soc = 0, socTgt = 0;
  var t0 = 0, lastT = 0, settle = 90;

  var spdEl = document.getElementById('spd');
  var aecEl = document.getElementById('aecv');
  var currEl = document.getElementById('curr');
  var ampFill = document.getElementById('ampfill');
  var altEl = document.getElementById('alt');
  var inEl = document.getElementById('intemp');
  var mTitle = document.getElementById('mtitle');
  var mArtist = document.getElementById('martist');
  var mPlay = document.getElementById('mplay');

  function hue() { return 186 + f * 26; }

  function frame(now) {
    if (!lastT) lastT = now;
    /* 限到 ~30fps：只在真正要画时推进 lastT。
       否则 60Hz 下 dt 恒为 16.7ms，会被永久跳过一帧也不画 */
    if (now - lastT < 30) { requestAnimationFrame(frame); return; }
    var dt = Math.min(80, now - lastT);
    lastT = now;
    t0 += dt;

    /* 没新数据、过渡也收敛了：整帧跳过，停车时几乎不耗 CPU */
    if (settle <= 0) { requestAnimationFrame(frame); return; }
    settle--;

    spdCur += (spdTgt - spdCur) * Math.min(1, dt / 220);
    soc += (socTgt - soc) * Math.min(1, dt / 400);
    f = Math.max(0, Math.min(1, spdCur / 160));

    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var h = hue();

    /* 外圈底弧：常显，保证任何速度下表盘都是完整的圆 */
    ctx.beginPath();
    ctx.arc(CX, CY, R + 2, A0, A0 + SWEEP, false);
    ctx.lineWidth = 1; ctx.strokeStyle = 'hsla(' + h + ',90%,72%,.24)'; ctx.stroke();

    /* 外圈刻度：60 条合并成 4 条路径（亮/暗 × 长/短），一次 stroke 顶原来 60 次 */
    var lit = f * (TICKS - 1);
    var cBright = 'hsla(' + h + ',100%,70%,.9)';
    var cDim = 'hsla(' + h + ',90%,72%,.34)';
    for (var pi = 0; pi < 4; pi++) {
      var wantOn = pi < 2, wantBig = (pi % 2) === 0;
      ctx.beginPath();
      for (var k = 0; k < TICKS; k++) {
        var g = TICK_GEO[k];
        if (g[4] !== wantBig || (k <= lit) !== wantOn) continue;
        ctx.moveTo(g[0], g[1]);
        ctx.lineTo(g[2], g[3]);
      }
      ctx.lineWidth = wantBig ? 2.2 : 1.1;
      ctx.strokeStyle = wantOn ? cBright : cDim;
      ctx.stroke();
    }

    /* 速度弧：底槽常显，只有亮层随速度增长 */
    var e = A0 + SWEEP * f;
    ctx.beginPath(); ctx.arc(CX, CY, R - 3, A0, A0 + SWEEP, false);
    ctx.lineWidth = 14; ctx.strokeStyle = 'hsla(' + h + ',100%,60%,.08)'; ctx.stroke();
    if (f > 0.002) {
      ctx.beginPath(); ctx.arc(CX, CY, R - 3, A0, e, false);
      ctx.lineWidth = 14; ctx.strokeStyle = 'hsla(' + h + ',100%,60%,.16)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(CX, CY, R - 3, A0, e, false);
      ctx.lineWidth = 4; ctx.strokeStyle = 'hsla(' + h + ',100%,70%,.92)'; ctx.stroke();
    }

    /* 内圈电量环 */
    ctx.beginPath();
    ctx.arc(CX, CY, 160, 0, TAU, false);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(52,211,153,.13)'; ctx.stroke();
    if (soc > 0.5) {
      ctx.beginPath();
      ctx.arc(CX, CY, 160, -Math.PI / 2, -Math.PI / 2 + TAU * soc / 100, false);
      ctx.lineWidth = 3;
      ctx.strokeStyle = soc < 15 ? 'rgba(251,113,133,.95)' : 'rgba(52,211,153,.9)';
      ctx.stroke();
    }

    /* 中心呼吸光：渐变复用，强度靠 globalAlpha 调 */
    ctx.globalAlpha = 0.05 + f * 0.08;
    ctx.fillStyle = GLOW_GRAD;
    ctx.fillRect(CX - 190, CY - 190, 380, 380);
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 数据入口 ---------- */
  function n(v, d) { return (v == null || isNaN(v)) ? '--' : Number(v).toFixed(d == null ? 1 : d); }

  window.onData = function (d) {
    settle = 60;   /* 有数据进来就画 2 秒，足够平滑过渡收敛 */
    var v = (d.SPEED == null || isNaN(d.SPEED)) ? 0 : Number(d.SPEED);
    spdTgt = v;   /* 车速只驱动外圈刻度与弧 */
    spdEl.textContent = (d.IPK_TRIPMETER_TRIP1 == null || isNaN(d.IPK_TRIPMETER_TRIP1))
      ? '--' : Number(d.IPK_TRIPMETER_TRIP1).toFixed(1);

    if (d.BMS_SOC_PERCENT != null) {
      socTgt = Number(d.BMS_SOC_PERCENT);   /* 只用来驱动内圈电量环 */
    }

    /* 电流竖条：零线在 25% 处。向上=放电 0~200A，向下=回收 0~60A */
    var amp = d.BMS_DISP_PACK_CURRENT_ORG;
    if (amp != null && !isNaN(amp)) {
      var a = Number(amp);
      currEl.textContent = a.toFixed(1);
      if (a >= 0) {
        ampFill.style.bottom = '25%';
        ampFill.style.height = Math.min(75, a / 200 * 75).toFixed(2) + '%';
        /* 负载分级：绿 → 黄 → 红 */
        var bg, sh;
        if (a > AMP_HOT) {
          bg = 'linear-gradient(to top,#e11d48,#fb7185)';
          sh = '0 0 12px rgba(244,63,94,.85)';
        } else if (a > AMP_WARN) {
          bg = 'linear-gradient(to top,#ca8a04,#facc15)';
          sh = '0 0 12px rgba(250,204,21,.8)';
        } else {
          bg = 'linear-gradient(to top,#059669,#34d399)';
          sh = '0 0 10px rgba(52,211,153,.75)';
        }
        ampFill.style.background = bg;
        ampFill.style.boxShadow = sh;
      } else {
        var hh = Math.min(25, -a / 60 * 25);
        ampFill.style.bottom = (25 - hh).toFixed(2) + '%';
        ampFill.style.height = hh.toFixed(2) + '%';
        /* 动能回收：蓝色，和放电的绿/黄/红分开 */
        ampFill.style.background = 'linear-gradient(to bottom,#3b82f6,#93c5fd)';
        ampFill.style.boxShadow = '0 0 12px rgba(96,165,250,.85)';
      }
    } else {
      currEl.textContent = '--';
      ampFill.style.bottom = '25%';
      ampFill.style.height = '0%';
    }

    /* 电耗 */
    var a = d.IPK_AVERAGE_PC_AEC1;
    aecEl.textContent = (a == null || isNaN(a) ? '--' : Number(a).toFixed(1));

    /* 胎压（kPa，推荐 250）：<200 或 >300 红，230~270 之外琥珀 */
    [['tfl', 'fl', d.FL_TIRE_PRESSURE],
     ['tfr', 'fr', d.FR_TIRE_PRESSURE],
     ['trl', 'rl', d.RL_TIRE_PRESSURE],
     ['trr', 'rr', d.RR_TIRE_PRESSURE]].forEach(function (it) {
      var el = document.getElementById(it[0]);
      var pv = it[2];
      var ok = pv != null && !isNaN(pv);
      el.textContent = ok ? Math.round(pv) : '--';
      var cls = 'wheel ' + it[1];
      if (ok && (pv < 200 || pv > 300)) cls += ' bad';
      else if (ok && (pv < 230 || pv > 270)) cls += ' warn';
      el.parentNode.className = cls;
    });

    altEl.textContent = (d.alt == null || isNaN(d.alt)) ? '--' : Math.round(d.alt) + ' m';
    inEl.textContent = (d.IACINCARTEM == null || isNaN(d.IACINCARTEM))
      ? '--' : Math.round(d.IACINCARTEM) + ' °C';

    /* 多媒体：标题居中，艺术家跟在后面，播放中音符亮、暂停变暗 */
    mTitle.textContent = d.mediaTitle || '--';
    mArtist.textContent = d.mediaArtist || '';
    mPlay.style.opacity = d.mediaPlaying ? 1 : 0.3;
  };
})();
</script>
</body></html>
