<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:rgba(0,0,0,.85);
  font-family:monospace;color:#e0e0e0}
#head{padding:12px 20px;border-bottom:1px solid #333;font-size:21px}
#head b{color:#ffd60a}
#head .t{color:#78909c;font-size:16px}
#list{padding:10px 20px;font-size:18px;line-height:1.55;height:calc(100% - 58px);
  box-sizing:border-box;overflow:hidden}
.row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{color:#78909c}
.k{color:#64b5f6}
.d{color:#00e676}
</style></head>
<body>
<div id="head">等待数据…</div>
<div id="list"></div>
<script>
var head=document.getElementById('head'), list=document.getElementById('list');
var last='';
function hms(){
  var t=new Date();
  function p(n){return (n<10?'0':'')+n;}
  return p(t.getHours())+':'+p(t.getMinutes())+':'+p(t.getSeconds());
}
window.onData=function(d){
  var on = !!d.onDesktop;
  head.innerHTML = '<b>' + (on ? '桌面' : 'APP') + '</b> &nbsp; '
      + (d.fgApp || '-')
      + ' &nbsp; <span class="t">tick=' + (d._tick|0) + '</span>';
  // 只有状态真的变了才追加一行，避免每秒刷屏
  var line = on + '|' + (d.fgApp||'') + '|' + (d.mediaTitle||'');
  if (line === last) return;
  last = line;
  var div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = '<span class="t">' + hms() + '</span> &nbsp; '
      + (on ? '<span class="d">DESKTOP</span>' : '<span class="k">APP</span>')
      + ' &nbsp; ' + (d.fgApp || '-')
      + (d.mediaTitle ? ' &nbsp;♪ ' + d.mediaTitle : '');
  list.appendChild(div);
  while (list.children.length > 20) list.removeChild(list.firstChild);
};
</script>
</body></html>
