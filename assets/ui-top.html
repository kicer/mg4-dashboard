<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;
  font-family:monospace;color:#fff}
#bar{display:flex;align-items:center;gap:14px;height:100%;
  padding-left:620px;padding-right:220px;
  box-sizing:border-box;font-size:16px}
#st{padding:3px 12px;border-radius:5px;font-weight:bold;font-size:15px;letter-spacing:1px}
.desktop{background:#ff1744;color:#04220e}
.app{background:#ff9100;color:#2b1700}
#pkg{color:#b0bec5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#right{margin-left:auto;color:#90a4ae;font-size:14px}
</style></head>
<body>
<div id="bar">
  <span id="st" class="desktop">--</span>
  <span id="pkg">等待数据…</span>
  <span id="right"></span>
</div>
<script>
var st=document.getElementById('st'), pkg=document.getElementById('pkg'),
    right=document.getElementById('right');
window.onData=function(d){
  var on = !!d.onDesktop;
  st.textContent = on ? '桌面' : 'APP';
  st.className   = on ? 'desktop' : 'app';
  pkg.textContent = d.fgApp || '-';
  right.textContent = 'tick ' + (d._tick|0);
};
</script>
</body></html>
